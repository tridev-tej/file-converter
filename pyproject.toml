[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-converter"
version = "1.0.0"
description = "A drag-and-drop conversion wheel for macOS and Windows"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Tejesh Vaish"}]
dependencies = [
  "PySide6==6.12.0", "pillow==13.0.0", "pillow_heif==1.8.1",
  "imageio-ffmpeg==0.6.0", "pypandoc_binary==1.17", "pypdf==6.21.1",
  "pypdfium2==5.14.0", "python-docx==1.2.0", "python-pptx==1.0.2",
  "openpyxl==3.1.5", "xlrd==2.0.2", "odfpy==1.4.1", "py7zr==1.1.4",
  "pynput==1.8.2; sys_platform == 'win32'",
  "pyobjc-core==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-CoreML==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-CoreText==12.2.2; sys_platform == 'darwin'"
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]
test = ["pytest==9.1.1"]

[project.scripts]
file-converter = "file_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_converter = ["resources/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--basetemp=build/pytest"
cache_dir = "build/pytest-cache"
